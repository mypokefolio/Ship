<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ship PDF Studio — Splice · Crop · Merge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧬</text></svg>">
</head>
<body>

<header>
  <div class="brand-row">
    <canvas id="helixMini" width="54" height="54" aria-hidden="true"></canvas>
    <h1 class="brand">SHIP <em>PDF STUDIO</em></h1>
  </div>
  <p class="tagline">Load strands &middot; crop the sequence &middot; splice into one</p>
</header>

<main>
  <!-- Drop zone -->
  <section id="dropzone" tabindex="0" aria-label="Drop PDF files here or click to browse">
    <div class="dz-inner">
      <div class="dz-icon" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M20 6v20M20 26l-7-7M20 26l7-7"/><path d="M8 32h24"/>
        </svg>
      </div>
      <div class="dz-title">Drop PDF strands here</div>
      <div class="dz-sub">or click to browse &mdash; load as many as you need</div>
    </div>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
  </section>

  <!-- Toolbar -->
  <section id="toolbar" class="hidden">
    <div class="tb-group">
      <label for="outName">Strand name</label>
      <input type="text" id="outName" value="merged-labels" spellcheck="false">
    </div>
    <div class="tb-group tb-actions">
      <button id="btnMerge" class="btn btn-gold" title="Splice every selected page (crops applied) into a single document">
        <svg class="ic" viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 4c5 0 9 12 14 12M3 16C8 16 12 4 17 4"/></svg>
        Splice &amp; Merge
      </button>
      <button id="btnSplit" class="btn" title="Download every selected page as its own PDF">Split pages</button>
      <button id="btnPerDoc" class="btn" title="Download each document separately (selected pages, crops applied)">Save each doc</button>
      <button id="btnClear" class="btn btn-danger" title="Remove all loaded documents">Clear lab</button>
    </div>
    <div id="status" class="tb-status"></div>
  </section>

  <!-- Loaded documents -->
  <section id="docs"></section>
</main>

<!-- Splice animation overlay -->
<div id="spliceOverlay" class="hidden" aria-hidden="true">
  <canvas id="spliceCanvas"></canvas>
  <div id="spliceLabel">UNWINDING STRANDS</div>
</div>

<!-- Crop editor modal -->
<div id="cropModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2 id="cropTitle">Crop</h2>
        <div id="cropDims" class="crop-dims">Drag on the page to draw a crop box</div>
      </div>
      <button id="cropClose" class="btn btn-ghost" title="Close (Esc)">&#10005;</button>
    </div>
    <div id="cropStage">
      <canvas id="cropCanvas"></canvas>
      <div id="cropRect" class="hidden"></div>
    </div>
    <div class="modal-foot">
      <button id="cropApplyPage" class="btn">Apply to This Page</button>
      <button id="cropApplyDoc" class="btn">Apply to Whole Doc</button>
      <button id="cropApplyAll" class="btn btn-gold">Apply to ALL Docs</button>
      <span class="spacer"></span>
      <button id="cropClearPage" class="btn btn-ghost">Clear This Page</button>
      <button id="cropClearAll" class="btn btn-ghost">Clear All Crops</button>
    </div>
  </div>
</div>

<footer>
  Everything runs in your browser &mdash; your PDFs never leave your machine.
</footer>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="app.js"></script>
</body>
</html>
