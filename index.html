<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ship PDF Studio — Crop · Merge · Split</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🏷️</text></svg>">
</head>
<body>

<header>
  <h1>Ship <span class="accent">PDF Studio</span></h1>
  <p class="tagline">Crop, combine &amp; split PDFs — labels and pick lists, done fast.</p>
</header>

<main>
  <!-- Drop zone -->
  <section id="dropzone" tabindex="0" aria-label="Drop PDF files here or click to browse">
    <div class="dz-inner">
      <div class="dz-icon">⇩</div>
      <div class="dz-title">Drop PDFs here</div>
      <div class="dz-sub">or click to browse — multiple files welcome</div>
    </div>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
  </section>

  <!-- Toolbar -->
  <section id="toolbar" class="hidden">
    <div class="tb-group">
      <label for="outName">Output name</label>
      <input type="text" id="outName" value="merged-labels" spellcheck="false">
    </div>
    <div class="tb-group tb-actions">
      <button id="btnMerge" class="btn btn-gold" title="Combine every selected page into one PDF">Merge Selected → 1 PDF</button>
      <button id="btnSplit" class="btn" title="Download every selected page as its own PDF">Split → 1 file per page</button>
      <button id="btnPerDoc" class="btn" title="Download each document separately (selected pages, crops applied)">Save Each Doc</button>
      <button id="btnClear" class="btn btn-danger" title="Remove all loaded documents">Clear All</button>
    </div>
    <div id="status" class="tb-status"></div>
  </section>

  <!-- Loaded documents -->
  <section id="docs"></section>
</main>

<!-- Crop editor modal -->
<div id="cropModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-card">
    <div class="modal-head">
      <div>
        <h2 id="cropTitle">Crop</h2>
        <div id="cropDims" class="crop-dims">Drag on the page to draw a crop box</div>
      </div>
      <button id="cropClose" class="btn btn-ghost" title="Close (Esc)">✕</button>
    </div>
    <div id="cropStage">
      <canvas id="cropCanvas"></canvas>
      <div id="cropRect" class="hidden"></div>
    </div>
    <div class="modal-foot">
      <button id="cropApplyPage" class="btn">Apply to This Page</button>
      <button id="cropApplyDoc" class="btn">Apply to Whole Doc</button>
      <button id="cropApplyAll" class="btn btn-gold">Apply to ALL Docs</button>
      <span class="spacer"></span>
      <button id="cropClearPage" class="btn btn-ghost">Clear This Page</button>
      <button id="cropClearAll" class="btn btn-ghost">Clear All Crops</button>
    </div>
  </div>
</div>

<footer>
  Everything runs in your browser — your PDFs never leave your machine.
</footer>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="app.js"></script>
</body>
</html>
